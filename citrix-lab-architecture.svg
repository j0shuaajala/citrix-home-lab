<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <style>
    /* Animated flow arrows */
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: flow 1.6s linear infinite;
    }
    .flow-dash-slow {
      stroke-dasharray: 8 6;
      animation: flow 2.4s linear infinite;
    }
    .flow-dash-med {
      stroke-dasharray: 8 6;
      animation: flow 2s linear infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: -56; }
    }
    .dlp-pulse {
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-dash, .flow-dash-slow, .flow-dash-med, .dlp-pulse {
        animation: none;
        stroke-dasharray: none;
      }
    }
  </style>
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388bfd"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arr-warn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f0883e"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bc8cff"/>
    </marker>

    <!-- Gradient fills -->
    <linearGradient id="grad-host" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a2e"/>
      <stop offset="100%" stop-color="#091220"/>
    </linearGradient>
    <linearGradient id="grad-dc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2445"/>
      <stop offset="100%" stop-color="#081830"/>
    </linearGradient>
    <linearGradient id="grad-ctx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0a38"/>
      <stop offset="100%" stop-color="#110826"/>
    </linearGradient>
    <linearGradient id="grad-vda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2614"/>
      <stop offset="100%" stop-color="#051810"/>
    </linearGradient>
    <linearGradient id="grad-azure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14101e"/>
      <stop offset="100%" stop-color="#0c0814"/>
    </linearGradient>

    <!-- Grid background pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1a2540" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
